name: Ronin CLI Release

on:
  push:
    tags: ["ronin-v*"]

permissions:
  contents: write

jobs:
  artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          toolchain: "1.88.0"
          command: build
          target: ${{ matrix.target }}
          args: "--release --locked -p ronin-cli"
      - name: Package
        if: runner.os != 'Windows'
        run: |
          mkdir staging
          cp "target/${{ matrix.target }}/release/ronin" staging/ronin
          tar -C staging -czf "ronin-${{ matrix.target }}.tar.gz" ronin
          shasum -a 256 "ronin-${{ matrix.target }}.tar.gz" > "ronin-${{ matrix.target }}.sha256"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ronin.exe" staging/ronin.exe
          Compress-Archive -Path staging/ronin.exe -DestinationPath "ronin-${{ matrix.target }}.zip"
          $hash = (Get-FileHash "ronin-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "ronin-${{ matrix.target }}.sha256",
            "$hash  ronin-${{ matrix.target }}.zip`n",
            [Text.Encoding]::ASCII
          )
      - uses: actions/upload-artifact@v7
        with:
          name: ronin-${{ matrix.target }}
          path: |
            ronin-${{ matrix.target }}.*

  release:
    needs: artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ronin-*
          merge-multiple: true
      - name: Create checksum manifest
        run: cat *.sha256 | sort -k2 > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            ronin-*.tar.gz
            ronin-*.zip
            SHA256SUMS
