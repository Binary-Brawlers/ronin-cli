[workspace]
resolver = "2"
members = ["crates/ronin-agent-core", "apps/cli"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Binary-Brawlers/ronin-cli"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures = "0.3"
fs2 = "0.4.3"
flate2 = "1"
ignore = "0.4"
keyring = "4.1.5"
jsonwebtoken = "9"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
reqwest-eventsource = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
self-replace = "1.5"
sha2 = "0.11"
similar = "2"
tar = "0.4"
tempfile = "3"
thiserror = "2"
ts-rs = "12.0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
toml = "0.8"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
urlencoding = "2"
url = "2.5"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
